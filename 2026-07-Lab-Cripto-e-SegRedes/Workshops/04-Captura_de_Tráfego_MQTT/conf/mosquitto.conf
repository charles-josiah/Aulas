# ============================================================
# Broker MQTT - Laboratorio de Seguranca (SEM TLS)
# Workshop 04: Ataques de Interceptacao e Injecao de Dados em MQTT
#
# IMPORTANTE: configuracao DIDATICA, vulneravel por design.
# - Sem TLS: todo o trafego (incluindo usuario/senha do CONNECT)
#   trafega em TEXTO CLARO na rede.
# - Autenticacao por usuario/senha (password_file) da a impressao
#   de seguranca, mas as credenciais podem ser sniffadas.
# ============================================================

# Persistencia e log
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type all

# Listener principal - texto claro na porta 1883 (SEM TLS)
listener 1883 0.0.0.0

# Autenticacao por usuario/senha
# VETOR DE ATAQUE: as credenciais viajam no pacote CONNECT em plaintext
allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd

# Sem ACL nesta fase: qualquer usuario autenticado pode publicar
# em qualquer topico (o atacante vai explorar isso na Fase 3)
# acl_file /mosquitto/config/mosquitto.acl   # descomentar na Fase 4
