# ============================================================
# Broker MQTT - Laboratorio de Seguranca - FASE 4 (Hardening)
# Mosquitto com autenticacao por usuario/senha + ACL
#
# Ainda SEM TLS (o TLS sera um proximo passo / desafiou o aluno).
# A evolucao desta fase em relacao ao mosquitto.conf original:
#   1. allow_anonymous false  (ja no original)
#   2. password_file          (ja no original)
#   3. acl_file               (NOVO) - controle de acesso por topico
# ============================================================

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type all

# Listener - texto claro na porta 1883 (SEM TLS, por enquanto)
listener 1883 0.0.0.0

# Autenticacao
allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd

# Controle de acesso por topico (ACL)
# - O SENSOR so pode PUBLICAR no proprio topico
# - O DASHBOARD so pode LER sensores/#
# - Nenhum usuario pode publicar fora do proprio topico
per_listener_settings true
acl_file /mosquitto/config/mosquitto.acl
