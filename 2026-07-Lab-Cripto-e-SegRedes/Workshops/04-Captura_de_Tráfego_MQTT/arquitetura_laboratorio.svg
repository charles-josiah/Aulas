<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="640" viewBox="0 0 1140 640" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c00000"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e75b6"/>
    </marker>
  </defs>

  <!-- Titulo -->
  <text x="570" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f4e79">Arquitetura do Laboratório — Workshop 04: MQTT sem Criptografia</text>

  <!-- Rede do laboratorio -->
  <rect x="20" y="60" width="1100" height="545" rx="14" fill="#f7fafd" stroke="#2e75b6" stroke-width="2" stroke-dasharray="9 6"/>
  <text x="570" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e75b6">REDE DO LABORATÓRIO — SUBREDE AUTORIZADA (somente lab / NAT / host-only)</text>

  <!-- ================= MAQUINA A (srvdocker01) ================= -->
  <rect x="50" y="110" width="470" height="450" rx="12" fill="#ffffff" stroke="#1f4e79" stroke-width="2.5"/>
  <rect x="50" y="110" width="470" height="44" rx="12" fill="#1f4e79"/>
  <rect x="50" y="132" width="470" height="22" fill="#1f4e79"/>
  <text x="285" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">MÁQUINA A — srvdocker01 (172.30.234.55)</text>

  <!-- Docker -->
  <rect x="80" y="175" width="410" height="355" rx="10" fill="#eef4fb" stroke="#2e75b6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="100" y="198" font-size="13" font-weight="bold" fill="#2e75b6">Docker (containers)</text>

  <!-- Broker mosquitto -->
  <rect x="105" y="215" width="210" height="120" rx="8" fill="#2e75b6" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="210" y="244" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">mosquitto</text>
  <text x="210" y="263" text-anchor="middle" font-size="12" fill="#ffffff">broker MQTT</text>
  <text x="210" y="281" text-anchor="middle" font-size="12" fill="#ffffff">porta 1883</text>
  <rect x="145" y="293" width="130" height="22" rx="5" fill="#c00000"/>
  <text x="210" y="309" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SEM TLS / SSL</text>

  <!-- Dashboard -->
  <rect x="335" y="215" width="135" height="120" rx="8" fill="#5b9bd5" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="402" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">dashboard</text>
  <text x="402" y="263" text-anchor="middle" font-size="11" fill="#ffffff">aplicacao.py</text>
  <text x="402" y="281" text-anchor="middle" font-size="10.5" fill="#ffffff">assina sensores/#</text>
  <text x="402" y="299" text-anchor="middle" font-size="10.5" fill="#ffffff">valida token</text>

  <!-- conexao broker <-> dashboard -->
  <line x1="315" y1="275" x2="333" y2="275" stroke="#1f4e79" stroke-width="2" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <text x="324" y="268" text-anchor="middle" font-size="9" fill="#1f4e79">MQTT</text>

  <!-- ================= MAQUINA B (kali) ================= -->
  <rect x="620" y="110" width="470" height="450" rx="12" fill="#ffffff" stroke="#1f4e79" stroke-width="2.5"/>
  <rect x="620" y="110" width="470" height="44" rx="12" fill="#1f4e79"/>
  <rect x="620" y="132" width="470" height="22" fill="#1f4e79"/>
  <text x="855" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">MÁQUINA B — kali (172.30.234.56)</text>

  <!-- Sensor -->
  <rect x="650" y="180" width="410" height="122" rx="8" fill="#d6e8c8" stroke="#70ad47" stroke-width="2"/>
  <text x="670" y="204" font-size="14" font-weight="bold" fill="#3c6e1f">1) SENSOR — dispositivo IoT (legítimo)</text>
  <text x="670" y="226" font-size="12" fill="#3c6e1f">python3 sensor.py 172.30.234.55</text>
  <text x="670" y="246" font-size="12" fill="#3c6e1f">publica JSON em</text>
  <text x="670" y="264" font-size="12" font-family="monospace" fill="#3c6e1f">'sensores/camara1/temperatura'</text>
  <text x="670" y="284" font-size="12" fill="#3c6e1f">a cada 5 segundos</text>

  <!-- Atacante -->
  <rect x="650" y="320" width="410" height="215" rx="8" fill="#f8d7d7" stroke="#c00000" stroke-width="2"/>
  <text x="670" y="344" font-size="14" font-weight="bold" fill="#a00000">2) ATACANTE (mesma rede)</text>
  <text x="670" y="368" font-size="12" fill="#a00000">a) sniffa as credenciais (tcpdump -A)</text>
  <text x="670" y="390" font-size="12" fill="#a00000">b) assina o tópico (tshark)</text>
  <text x="670" y="412" font-size="12" fill="#a00000">c) reutiliza usuário/senha/token capturados</text>
  <text x="670" y="436" font-size="13" font-weight="bold" fill="#c00000">d) injeta payload FALSO → 99.5 °C</text>
  <text x="670" y="460" font-size="12" fill="#a00000">e) dashboard exibe [ALERTA] crítico</text>
  <text x="670" y="484" font-size="12" fill="#a00000">f) operação induzida a resfriar a planta</text>
  <text x="670" y="516" font-size="11.5" fill="#a00000">tudo com as credenciais que viajaram em claro</text>

  <!-- Faixa de trafego MQTT -->
  <line x1="60" y1="585" x2="1080" y2="585" stroke="#c00000" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="570" y="572" text-anchor="middle" font-size="13" font-weight="bold" fill="#c00000">TRÁFEGO MQTT EM TEXTO CLARO — porta 1883</text>
  <text x="570" y="608" text-anchor="middle" font-size="12" fill="#333333">usuário / senha (CONNECT) e token (payload JSON) legíveis por qualquer observador da rede</text>
  <text x="570" y="628" text-anchor="middle" font-size="12" fill="#333333">→ o atacante reutiliza as credenciais capturadas para injetar dados falsos</text>

  <!-- Conexoes tracejadas ate a faixa de trafego -->
  <line x1="210" y1="335" x2="210" y2="585" stroke="#2e75b6" stroke-width="1.8" stroke-dasharray="5 4"/>
  <line x1="720" y1="302" x2="720" y2="585" stroke="#70ad47" stroke-width="1.8" stroke-dasharray="5 4"/>
  <line x1="970" y1="535" x2="970" y2="585" stroke="#c00000" stroke-width="1.8" stroke-dasharray="5 4"/>

  <!-- Legenda -->
  <text x="100" y="88" font-size="11" fill="#333333">legenda:</text>
  <rect x="145" y="76" width="14" height="14" rx="3" fill="#d6e8c8" stroke="#70ad47"/>
  <text x="164" y="88" font-size="11" fill="#333333">legítimo</text>
  <rect x="225" y="76" width="14" height="14" rx="3" fill="#f8d7d7" stroke="#c00000"/>
  <text x="244" y="88" font-size="11" fill="#333333">atacante</text>
  <rect x="310" y="76" width="14" height="14" rx="3" fill="#eef4fb" stroke="#2e75b6"/>
  <text x="329" y="88" font-size="11" fill="#333333">Docker</text>
</svg>
