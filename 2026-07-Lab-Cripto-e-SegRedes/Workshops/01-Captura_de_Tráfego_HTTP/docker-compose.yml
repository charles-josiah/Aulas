version: '3.8'

services:
  servidor:
    build: .
    container_name: laboratorio-servidor
    ports:
      - "5000:5000"
    volumes:
      - ./data:/home/tcpdump/data:rw
    environment:
      - FLASK_ENV=production
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5000
    cap_add:
      - NET_RAW
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    restart: unless-stopped
    networks:
      - laboratorio-network

networks:
  laboratorio-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_iptables: "true"

volumes:
  data:
